name: Build MiniCraft APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build MiniCraft Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find MiniCraft ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: MiniCraft ZIP tidak ditemukan."
            echo "Isi repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract MiniCraft
        shell: bash
        run: |
          mkdir -p extracted
          unzip -o "${{ steps.find_zip.outputs.zip }}" -d extracted

          echo "Isi hasil extract:"
          find extracted -maxdepth 4 -type f | sort

      - name: Find Buildozer project
        id: find_project
        shell: bash
        run: |
          SPEC=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "buildozer.spec" \
            | head -n 1)

          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec tidak ditemukan."
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")

          echo "Project ditemukan:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            build-essential

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install "cython<3"
          python -m pip install buildozer

      - name: Configure Android environment
        shell: bash
        run: |
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Show project files
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "Project:"
          pwd

          echo "Files:"
          find . -maxdepth 3 -type f | sort

          echo "Buildozer:"
          buildozer --version

      - name: Build APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        env:
          P4A_RELEASE_KEYSTORE: ""
        run: |
          yes | buildozer -v android debug

      - name: Find APK
        id: find_apk
        shell: bash
        run: |
          APK=$(find "${{ steps.find_project.outputs.project_dir }}/bin" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find "${{ steps.find_project.outputs.project_dir }}" \
              -maxdepth 4 \
              -type f \
              | sort
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniCraft-Mobile-APK
          path: ${{ steps.find_apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 14
