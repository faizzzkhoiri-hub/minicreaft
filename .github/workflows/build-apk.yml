name: Build MiniCraft APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract MiniCraft ZIP
        run: |
          unzip -o MiniCraft_Mobile_Full_3.0_GitHubActions.zip -d extracted
          cd extracted/mcfull
          echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            cmake build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3" buildozer

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniCraft-Mobile-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
          retention-days: 14
